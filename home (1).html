<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <a><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></a>
    <title>Document</title>

    <style>
        body{
            font-family: "Plus Jakarta Sans", sans-serif;
            background-color: #69798a;
            color:#191c1e;
            line-height: 1.5;
           text-align: center;

           
        }
         *{ 
          margin: 0;
          padding: 0;
          box-sizing: border-box;


               }
          header{
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            border-bottom: solid 1px #e0e3e5;
            max-width: 1000px;
            margin:auto;
            padding: 10px 20px;
          }
     
     
      #left-nav{
        display: flex;
        align-items: center;
        gap: 12px;
        ul{
          display:flex;
          list-style: none;

      a{
        text-decoration: none;
        justify-content: center;
        color: #464554;
        font-weight: 600;
        margin: 6px 12px;
        border-radius: 8px;
        transition: all 0.3s ease;

      }
      a:hover{
        background-color: #e6e8ea;
        color: #4648d4;
      }
      a.active{
        background-color: #e6e8ea;
        color: #4648d4;

      }

      }
      #logo{
        font-weight: bold;
        font-size: 20px;
        color:#4648d4
      }
    }
   
      #right-nav{
        display: flex;
        align-items: center;
        gap: 12px;
        p{
          border-radius: 20px;
            padding: 6px 12px;
            background-color: #e6e8ea;
            font-weight: 600;
            font-size: 14px;
          }

      
      
        #avatar{
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: solid 2px #4648d4;
        object-fit: cover;
      }
      }
 
    </style>
  </head>
  <body>
    <header>
      <section id="left-nav">
<h2 id="logo">Quizmaster</h2>
   <nav id="nav">
      <ul>
        <a class="active"> <li>Home</li></a>
        <a href="#"> <li>Ranks</li></a>
        <a href="#"> <li>Profile</li></a>
        
      </ul>
    </nav>
      </section>
  <section id="right-nav">
  <p> Lvl 12 • 450 Coins</p>
  <img id="avatar" src="https://i.pravatar.cc/100?img=12" alt="user image">
  </section>
 
</header>
    <section id="hero"class="text-center p-4">
    <h3 class="">Ready To Play, Samuel? 👍</h3>
    <p>Your brain is warmed up. Lets crush todays challenges!</p>
    <img style="border-radius: 5px;" width="100%" src="xbox controller.jpg" alt="">

    </section>

    <!-- <section id="hero"></section>
    <section id="about"></section>
    <section id="contact"></section> -->
  </body>
</html>
